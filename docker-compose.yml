services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile
    container_name: ultralims-backend
    ports:
      - "8081:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ultralims_teste
      DB_USERNAME: ultralims
      DB_PASSWORD: ultralims
      SAMPLE_PREFIX: CAND047
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ultralims-network

  db:
    image: mysql:8.0
    container_name: ultralims-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ultralims_teste
      MYSQL_USER: ultralims
      MYSQL_PASSWORD: ultralims
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ultralims-db-data:/var/lib/mysql
      - ./docker/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ultralims-network

networks:
  ultralims-network:
    driver: bridge

volumes:
  ultralims-db-data: